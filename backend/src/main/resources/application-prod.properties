# Production Database Configuration for Railway
# Use environment variables for security
# Support both Railway's default DATABASE_URL (without jdbc:) and custom (with jdbc:)
# If DATABASE_URL starts with 'postgresql://', prepend 'jdbc:'
# Otherwise, use as is
spring.datasource.url=jdbc:postgresql://mj_ninja:Ninja%4024199@postgres.railway.internal:5432/mj_fabrication
spring.datasource.username=mj_ninja
spring.datasource.password=Ninja@24199
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Configuration - Use PORT environment variable if available, otherwise default to 8080
server.port=8080
server.error.include-stacktrace=never

# Logging Configuration
logging.level.com.mjfabrication=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.root=INFO

# Security Headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
