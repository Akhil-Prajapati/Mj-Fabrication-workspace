# Production Database Configuration for Railway
# Use environment variables for security
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mj_fabrication}
spring.datasource.username=${DATABASE_USERNAME:mj_ninja}
spring.datasource.password=${DATABASE_PASSWORD:Ninja@24199}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Configuration - Use PORT environment variable if available, otherwise default to 8080
server.port=${PORT:8080}
server.error.include-stacktrace=never

# Logging Configuration
logging.level.com.mjfabrication=${LOGGING_LEVEL_COM_MJFABRICATION:INFO}
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}

# Security Headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
